<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AI Personal Shopping Agent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header" id="site-header">
  <div class="header-left">
    <div class="logo-icon">🛍️</div>
    <div class="logo-text"><h1>ShopAI</h1><span>Your Intelligent Shopping Agent</span></div>
  </div>
  <div class="header-right">
    <div class="header-actions">
      <button class="icon-btn theme-toggle" id="themeToggle"><i class="fa fa-moon" id="theme-icon"></i></button>
      <a href="login.html" class="btn btn-outline btn-sm">Login</a>
    </div>
  </div>
</header>

<main class="section" style="min-height:calc(100vh - 70px);">
  <div class="container" style="max-width:860px;">
    <div class="text-center mb-3">
      <h2 class="section-title">Create Your Account</h2>
      <p>Join ShopAI and get personalized product recommendations powered by AI.</p>
    </div>

    <div class="card">
      <form id="register-form" action="register_process.php" method="POST" enctype="multipart/form-data" autocomplete="off">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem;">

          <!-- Left column -->
          <div>
            <h3 style="margin-bottom:1.25rem; color:var(--primary); font-size:0.95rem; text-transform:uppercase; letter-spacing:0.05em;">Personal Information</h3>

            <div class="form-group">
              <label class="form-label" for="fullName">Full Name <span class="req">*</span></label>
              <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Enter your full name" maxlength="80" required aria-describedby="fullName-err" />
              <span class="error-msg" id="fullName-err"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="email">Email Address <span class="req">*</span></label>
              <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required aria-describedby="email-err" />
              <span class="error-msg" id="email-err"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Phone Number <span class="req">*</span></label>
              <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}" maxlength="10" required aria-describedby="phone-err" />
              <span class="error-msg" id="phone-err"></span>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="dob">Date of Birth <span class="req">*</span></label>
                <input type="date" id="dob" name="dob" class="form-control" required aria-describedby="dob-err" />
                <span class="error-msg" id="dob-err"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="age">Age</label>
                <input type="number" id="age" name="age" class="form-control" placeholder="Enter age (e.g. 21)" min="1" max="120" />
                <span class="error-msg" id="age-err"></span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Gender <span class="req">*</span></label>
              <div style="display:flex; gap:1.5rem; margin-top:0.25rem;">
                <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                  <input type="radio" name="gender" value="male" required /> Male
                </label>
                <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                  <input type="radio" name="gender" value="female" /> Female
                </label>
                <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                  <input type="radio" name="gender" value="other" /> Other
                </label>
              </div>
              <span class="error-msg" id="gender-err"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="pref-time">Preferred Shopping Time</label>
              <input type="time" id="pref-time" name="prefTime" class="form-control" />
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Password <span class="req">*</span></label>
              <input type="password" id="password" name="password" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 number" minlength="8" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" required aria-describedby="password-err" />
              <span class="error-msg" id="password-err"></span>
              <div id="pw-strength" style="height:4px;border-radius:2px;margin-top:5px;transition:all 0.3s;"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="confirmPw">Confirm Password <span class="req">*</span></label>
              <input type="password" id="confirmPw" name="confirmPw" class="form-control" placeholder="Re-enter your password" required aria-describedby="confirmPw-err" />
              <span class="error-msg" id="confirmPw-err"></span>
            </div>
          </div>

          <!-- Right column -->
          <div>
            <h3 style="margin-bottom:1.25rem; color:var(--primary); font-size:0.95rem; text-transform:uppercase; letter-spacing:0.05em;">Address &amp; Preferences</h3>

            <div class="form-group">
              <label class="form-label" for="address">Address</label>
              <textarea id="address" name="address" class="form-control" rows="2" placeholder="House / Flat No., Street, Area" spellcheck="true" maxlength="200"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="city">City <span class="req">*</span></label>
                <input type="text" id="city" name="city" class="form-control" placeholder="City" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="state">State <span class="req">*</span></label>
                <select id="state" name="state" class="form-control" required aria-describedby="state-err">
                  <option value="">Select State</option>
                  <option>Tamil Nadu</option><option>Maharashtra</option><option>Karnataka</option>
                  <option>Delhi</option><option>West Bengal</option><option>Uttar Pradesh</option>
                  <option>Gujarat</option><option>Rajasthan</option><option>Telangana</option><option>Kerala</option>
                </select>
                <span class="error-msg" id="state-err"></span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="country">Country</label>
              <select id="country" name="country" class="form-control">
                <option value="IN" selected>India 🇮🇳</option>
                <option value="US">United States 🇺🇸</option>
                <option value="UK">United Kingdom 🇬🇧</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Preferred Categories</label>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.35rem;">
                <label class="filter-option"><input type="checkbox" name="categories" value="Laptops" /> Laptops</label>
                <label class="filter-option"><input type="checkbox" name="categories" value="Smartphones" /> Smartphones</label>
                <label class="filter-option"><input type="checkbox" name="categories" value="Audio" /> Audio</label>
                <label class="filter-option"><input type="checkbox" name="categories" value="Tablets" /> Tablets</label>
                <label class="filter-option"><input type="checkbox" name="categories" value="Smart Home" /> Smart Home</label>
                <label class="filter-option"><input type="checkbox" name="categories" value="Gaming" /> Gaming</label>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Preferred Brands</label>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.35rem;">
                <label class="filter-option"><input type="checkbox" name="brands" value="Apple" /> Apple</label>
                <label class="filter-option"><input type="checkbox" name="brands" value="Samsung" /> Samsung</label>
                <label class="filter-option"><input type="checkbox" name="brands" value="Sony" /> Sony</label>
                <label class="filter-option"><input type="checkbox" name="brands" value="ASUS" /> ASUS</label>
                <label class="filter-option"><input type="checkbox" name="brands" value="OnePlus" /> OnePlus</label>
                <label class="filter-option"><input type="checkbox" name="brands" value="Dell" /> Dell</label>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="budget">Budget Range (₹)</label>
              <select id="budget" name="budget" class="form-control">
                <option value="">Select Budget</option>
                <option value="0-10000">Under ₹10,000</option>
                <option value="10000-25000">₹10,000 – ₹25,000</option>
                <option value="25000-50000">₹25,000 – ₹50,000</option>
                <option value="50000-100000">₹50,000 – ₹1,00,000</option>
                <option value="100000+">Above ₹1,00,000</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="skills">Interests / Skills</label>
              <input type="text" id="skills" name="skills" class="form-control" placeholder="e.g. Gaming, Photography, Music" />
            </div>

            <div class="form-group">
              <label class="form-label" for="profile-pic">Profile Picture</label>
              <input type="file" id="profile-pic" name="profilePic" class="form-control" accept="image/jpeg,image/png,image/webp" aria-describedby="pic-err" />
              <span class="error-msg" id="pic-err"></span>
              <small style="color:var(--text-muted); font-size:0.75rem;">Max 2MB. JPG, PNG, WebP</small>
            </div>
          </div>
        </div>

        <!-- Comments (contenteditable + spellcheck) -->
        <div class="form-group">
          <label class="form-label">Additional Comments / Notes</label>
          <div id="user-notes" contenteditable="true" spellcheck="true"
            style="background:var(--bg-3); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:0.65rem 1rem; color:var(--text); min-height:70px; font-size:0.9rem; font-family:var(--font);"
            aria-label="Additional notes">Type any additional information here...</div>
        </div>

        <div id="form-success" class="success-msg mb-2" style="display:none; font-size:0.9rem;"></div>
        <div id="form-error-summary" class="error-msg mb-2" style="display:none; font-size:0.9rem;"></div>

        <div class="flex gap-1" style="flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">Create Account</button>
          <button type="reset" class="btn btn-outline btn-lg" id="reset-btn">Reset Form</button>
          <button type="button" class="btn btn-danger btn-lg" onclick="window.location='index.html'">Cancel</button>
        </div>

        <p style="margin-top:1.25rem; font-size:0.85rem; color:var(--text-muted);">
          Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Sign In →</a>
        </p>
      </form>
    </div>
  </div>
</main>

<div class="toast-container" id="toast-container"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/main.js"></script>
<script>
/* ── Registration Form Validation ── */
(function() {
  const form = document.getElementById('register-form');
  const dob  = document.getElementById('dob');
  const age  = document.getElementById('age');

  // Set max selectable date dynamically to today
  if (dob) {
    const todayStr = new Date().toISOString().split('T')[0];
    dob.setAttribute('max', todayStr);
    dob.setAttribute('min', '1920-01-01');

    // Click anywhere on date field to open native calendar picker
    dob.addEventListener('click', function() {
      try { this.showPicker?.(); } catch (e) {}
    });
  }

  // Exact age calculation function
  function syncAgeFromDob() {
    if (!dob?.value) return;
    const parts = dob.value.split('-');
    if (parts.length !== 3) return;

    const birthYear = parseInt(parts[0], 10);
    const birthMonth = parseInt(parts[1], 10) - 1;
    const birthDay = parseInt(parts[2], 10);

    const now = new Date();
    let calculatedAge = now.getFullYear() - birthYear;
    const monthDiff = now.getMonth() - birthMonth;
    if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < birthDay)) {
      calculatedAge--;
    }

    if (calculatedAge >= 0 && calculatedAge <= 120) {
      if (age) age.value = calculatedAge;
      clearError('dob');
      clearError('age');
    } else {
      setError('dob', 'Please select a valid date of birth.');
    }
  }

  // Sync when date changes or is typed
  dob?.addEventListener('change', syncAgeFromDob);
  dob?.addEventListener('input', syncAgeFromDob);

  // Allow manual entry of age
  age?.addEventListener('input', function() {
    const val = parseInt(this.value, 10);
    if (!isNaN(val) && val >= 1 && val <= 120) {
      clearError('age');
      // If DOB is not yet set, suggest an approximate birth year
      if (!dob.value) {
        const estYear = new Date().getFullYear() - val;
        dob.value = `${estYear}-01-01`;
        clearError('dob');
      }
    } else if (this.value.trim() !== '') {
      setError('age', 'Please enter a valid age (1-120).');
    }
  });

  // Password strength
  document.getElementById('password')?.addEventListener('input', function() {
    const v = this.value;
    const bar = document.getElementById('pw-strength');
    let strength = 0;
    if (v.length >= 8) strength++;
    if (/[A-Z]/.test(v)) strength++;
    if (/[0-9]/.test(v)) strength++;
    if (/[^A-Za-z0-9]/.test(v)) strength++;
    const colors = ['', 'var(--danger)', 'var(--warning)', 'var(--info)', 'var(--success)'];
    const widths = ['0%', '25%', '50%', '75%', '100%'];
    if (bar) { bar.style.width = widths[strength]; bar.style.background = colors[strength]; }
  });

  // File validation
  document.getElementById('profile-pic')?.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { setError('pic', 'File size must be under 2MB.'); this.value = ''; return; }
    if (!['image/jpeg','image/png','image/webp'].includes(file.type)) { setError('pic', 'Only JPG, PNG, WebP files allowed.'); this.value = ''; return; }
    clearError('pic'); 
  });

  function setError(field, msg) {
    const el = document.getElementById(`${field}-err`);
    const inp = document.getElementById(field);
    if (el) el.textContent = msg;
    if (inp) inp.classList.add('error');
  }
  function clearError(field) {
    const el  = document.getElementById(`${field}-err`);
    const inp = document.getElementById(field);
    if (el) el.textContent = '';
    if (inp) { inp.classList.remove('error'); inp.classList.add('success'); }
  }

  form?.addEventListener('submit', async (e) => {
    e.preventDefault();
    let valid = true;

    const fields = [
      { id:'fullName', msg:'Full name is required (min 2 characters).', check: v => v.trim().length >= 2 },
      { id:'email', msg:'Please enter a valid email address or phone/ID.', check: v => v.trim().length >= 3 },
      { id:'phone', msg:'Please enter a contact number.', check: v => v.trim().length >= 5 },
      { id:'password', msg:'Password must be at least 6 characters.', check: v => v.length >= 6 },
    ];

    fields.forEach(f => {
      const el = document.getElementById(f.id);
      if (!el) return;
      if (!f.check(el.value)) { setError(f.id, f.msg); valid = false; }
      else clearError(f.id);
    });

    // Confirm password
    const pw = document.getElementById('password')?.value;
    const cpw = document.getElementById('confirmPw')?.value;
    if (pw && cpw && pw !== cpw) { setError('confirmPw', 'Passwords do not match.'); valid = false; }
    else if (cpw) clearError('confirmPw');

    if (!valid) {
      const errSummary = document.getElementById('form-error-summary');
      if (errSummary) { errSummary.textContent = '⚠️ Please fill out the required fields correctly.'; errSummary.style.display = 'block'; }
      return;
    }

    // Submit via AJAX to register_process.php
    const submitBtn = document.getElementById('submit-btn');
    const originalText = submitBtn ? submitBtn.textContent : 'Create Account';
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Saving to phpMyAdmin... ⏳'; }

    try {
      const formData = new FormData(form);
      const userNotes = document.getElementById('user-notes')?.innerText.trim();
      if (userNotes && userNotes !== 'Type any additional information here...') {
        formData.set('additionalComments', userNotes);
      }

      const res = await fetch('register_process.php', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();

      if (data.success) {
        document.getElementById('form-error-summary').style.display = 'none';
        const successEl = document.getElementById('form-success');
        successEl.innerHTML = `
          <div style="background:rgba(34,197,94,0.15); border:1.5px solid var(--success); padding:1rem; border-radius:8px; margin-bottom:1rem;">
            <div style="font-size:1.1rem; font-weight:700; color:var(--success); margin-bottom:0.4rem;">
              ✅ Registered Successfully in phpMyAdmin!
            </div>
            <div style="font-size:0.9rem; color:var(--text);">
              <strong>ID:</strong> #${data.registrationId} &nbsp;|&nbsp; 
              <strong>Database:</strong> <code>shop_db</code> &nbsp;|&nbsp; 
              <strong>Table:</strong> <code>registration__details</code>
            </div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.4rem;">
              <strong>Name:</strong> ${data.user.name} &nbsp;|&nbsp; <strong>Contact:</strong> ${data.user.email}
            </div>
            <div style="margin-top:0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
              <a href="http://localhost/phpmyadmin/index.php?route=/sql&db=shop_db&table=registration__details" target="_blank" class="btn btn-primary btn-sm" style="text-decoration:none;">
                📂 Open in phpMyAdmin →
              </a>
              <a href="php-module/records.php" target="_blank" class="btn btn-outline btn-sm" style="text-decoration:none;">
                📋 View Records Table →
              </a>
            </div>
          </div>
        `;
        successEl.style.display = 'block';
        window.showToast && showToast('Saved directly to shop_db in phpMyAdmin!', 'success', 5000);
        form.reset();
        const userNotesEl = document.getElementById('user-notes');
        if (userNotesEl) userNotesEl.innerText = 'Type any additional information here...';
      } else {
        const errSummary = document.getElementById('form-error-summary');
        errSummary.textContent = '❌ ' + (data.errors ? data.errors.join(', ') : (data.error || 'Registration failed.'));
        errSummary.style.display = 'block';
      }
    } catch (err) {
      const errSummary = document.getElementById('form-error-summary');
      errSummary.textContent = '❌ Server connection error: ' + err.message;
      errSummary.style.display = 'block';
    } finally {
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalText; }
    }
  });

  // Blur validation
  ['fullName','email','phone','password','city'].forEach(id => {
    document.getElementById(id)?.addEventListener('blur', function() {
      if (!this.value.trim()) setError(id, 'This field is required.');
      else clearError(id);
    });
  });
})();
</script>
</body>
</html>
